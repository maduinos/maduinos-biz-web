name: Deploy MADUINOS Biz Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Verify site
        run: python3 tools/verify_biz_web.py

      - name: Build static artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R assets pages index.html CNAME _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
